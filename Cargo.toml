[package]
name = "broker_gateway_service"
version = "0.1.0"
edition = "2024"
default-run = "broker_gateway_service"

[dependencies]
apca = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
futures = "0.3"
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
async-trait = "0.1"
dotenvy = "0.15"
num-decimal = { version = "0.2.5", features = ["num-v04"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
zmq = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redb = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "mock_sender"
path = "src/bin/mock_sender.rs"

[[bin]]
name = "subscription_tester"
path = "src/bin/subscription_tester.rs"

# Windows-optimized development profile
[profile.dev]
# Disable incremental on Windows to prevent file lock issues
incremental = false
# Optimize for compile time
codegen-units = 4
# Keep debug info for debugging
debug = true
# No optimization for faster builds
opt-level = 0

# Windows-optimized test profile
[profile.test]
# Disable incremental to prevent LNK1104 errors
incremental = false
# Use single codegen unit to reduce file handles
codegen-units = 1
# Enable debug info
debug = true
# No optimization for faster test compilation
opt-level = 0
# Don't split debuginfo to reduce file operations
split-debuginfo = "off"

# Windows release profile optimized for performance
[profile.release]
# Enable Link Time Optimization
lto = "thin"
# Optimize for speed
opt-level = 3
# Keep debug symbols for Windows debugging
strip = "none"
# Single codegen unit for better optimization
codegen-units = 1

# Windows-specific benchmark profile
[profile.bench]
incremental = false
codegen-units = 1
lto = "thin"
debug = true
