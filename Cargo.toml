[package]
name = "broker_gateway_service"
version = "0.1.0"
edition = "2024"
default-run = "broker_gateway_service"  # ← add this

[dependencies]
apca = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
futures = "0.3"
futures-util = "0.3"                                          # ← add
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }  # ← add
async-trait = "0.1"
dotenvy = "0.15"
num-decimal = { version = "0.2.5", features = ["num-v04"], default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
zmq            = "0.10"         # ZeroMQ (Windows compatible)
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redb           = "2.0"           # Pure Rust embedded database (better than SQLite for events)
chrono   = { version = "0.4", features = ["serde"] }

# Add this section if it doesn't exist yet:
[[bin]]
name = "mock_sender"
path = "src/bin/mock_sender.rs"

[[bin]]
name = "subscription_tester"
path = "src/bin/subscription_tester.rs"
